name: Prepare exact current alpha4 migration
on:
  push:
    branches: [prepare/alpha4-current450]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Original baseline gates
        run: |
          set -euo pipefail
          test "$(calcit -v)" = "0.31.0-alpha.2"
          caps --ci
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --quiet -- calcit.cirru deps.cirru package.json yarn.lock
          bash reviewed-gates.sh > acceptance-before.log 2>&1
      - name: Official scoped source transaction
        run: node apply-reviewed.mjs apply
      - name: Full after-source baseline gates
        run: |
          set -euo pipefail
          bash reviewed-gates.sh > acceptance-after-source.log 2>&1
          node apply-reviewed.mjs paired-baseline
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Paired alpha4 original gates
        run: |
          set -euo pipefail
          test "$(calcit -v)" = "0.31.0-alpha.4"
          caps --ci
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit format
          bash reviewed-gates.sh > acceptance-alpha4.log 2>&1
          node apply-reviewed.mjs verify
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: diary-current450-diagnostics
          path: |
            acceptance
            acceptance-*.log
          if-no-files-found: error
          retention-days: 30
