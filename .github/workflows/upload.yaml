name: Check and deploy

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: diary-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Set up Calcit and Caps
        uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Install dependencies
        run: |
          caps --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Check Calcit entries
        run: |
          set -euo pipefail
          calcit fix --workflow strict --verify --format edn
          calcit edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry server --check-only
          calcit analyze check-public --ns app.client --ns app.comp.container --ns app.comp.data-gather --ns app.comp.diary --ns app.comp.empty --ns app.comp.login --ns app.comp.month --ns app.comp.navigation --ns app.comp.profile --ns app.config --ns app.storage --ns app.style
          calcit --entry server analyze check-public --ns 'app.$meta' --ns app.config --ns app.schema --ns app.server --ns app.storage --ns app.twig.container --ns app.twig.user --ns app.updater --ns app.updater.diary --ns app.updater.router --ns app.updater.session --ns app.updater.user

      - name: Test storage and credential boundaries
        run: yarn test-boundaries

      - name: Build client
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/"
          fi
          base_url="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"
          export VITE_BASE_URL="${base_url}"
          yarn compile-page
          yarn release-page

      - name: Check current production revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skip stale production revision ${GITHUB_SHA}; current main is ${current_sha}."
          fi

      - name: Upload and verify static assets on COS
        if: steps.production.outputs.current == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        timeout-minutes: 10
        uses: worktools/cos-upload-action@v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Prepare server sources
        if: steps.production.outputs.current == 'true'
        run: |
          mkdir -p dist-server
          cp deps.cirru calcit.cirru package.json yarn.lock dist-server/

      - name: Configure deploy key
        if: steps.production.outputs.current == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key_tc }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/diary-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/diary-ssh/key"
          chmod 600 "$RUNNER_TEMP/diary-ssh/key"

      - name: Upload PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: >-
          rsync -avzr --progress
          -e "ssh -i $RUNNER_TEMP/diary-ssh/key -o StrictHostKeyChecking=accept-new"
          dist/
          rsync-user@chenyong.life:/web-assets/repo/${{ github.repository }}/pr/

      - name: Upload production web assets
        if: steps.production.outputs.current == 'true'
        run: >-
          rsync -avzr --progress
          -e "ssh -i $RUNNER_TEMP/diary-ssh/key -o StrictHostKeyChecking=accept-new"
          dist/
          rsync-user@chenyong.life:/web-assets/repo/${{ github.repository }}/

      - name: Upload server sources
        if: steps.production.outputs.current == 'true'
        run: >-
          rsync -avzr --progress
          -e "ssh -i $RUNNER_TEMP/diary-ssh/key -o StrictHostKeyChecking=accept-new"
          dist-server/
          rsync-user@chenyong.life:/servers/diary/
