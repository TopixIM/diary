name: Check and deploy

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: diary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180

      - name: Install dependencies
        run: |
          caps --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Check Calcit entries
        run: |
          set -o pipefail
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry server --check-only
          calcit calcit.cirru analyze dynamic-methods --summary-only --format json | tail -n 1 | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru --entry server analyze dynamic-methods --summary-only --format json | tail -n 1 | jq -e '.data.summary.findings == 0'
          calcit test --summary-only

      - name: Build client
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/"
          fi
          echo "VITE_BASE_URL=${CDN_ORIGIN}/${asset_prefix}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          export VITE_BASE_URL="${CDN_ORIGIN}/${asset_prefix}"
          yarn compile-page
          yarn release-page

      - name: Verify CDN asset references
        run: |
          node scripts/verify-cdn-build.mjs

      - name: Upload static assets to COS
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_ASSET_PREFIX: ${{ steps.asset-path.outputs.prefix }}
        run: |
          : "${COS_BUCKET:?Set COS_BUCKET}"
          : "${COS_SECRET_ID:?Set COS_SECRET_ID}"
          : "${COS_SECRET_KEY:?Set COS_SECRET_KEY}"
          curl -fL --retry 3 \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64 \
            -o "$RUNNER_TEMP/coscli"
          echo "a07de5ba2800147a700ed29036b0c76a4229088cee68e1682d0eae19b638a915  $RUNNER_TEMP/coscli" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/coscli"
          if ! "$RUNNER_TEMP/coscli" cp dist/ "cos://${COS_BUCKET}/${COS_ASSET_PREFIX}" -r \
            --init-skip=true --disable-log \
            -e cos.ap-shanghai.myqcloud.com \
            -i "$COS_SECRET_ID" -k "$COS_SECRET_KEY"; then
            echo "::error::COS upload failed; diagnostic codes from COSCLI:"
            if [[ -d coscli_output ]]; then
              rg --no-filename -o -i 'status(code)?[=: ]+[0-9]{3}|<Code>[^<]+|<Message>[^<]+|AccessDenied|SignatureDoesNotMatch|NoSuchBucket|Invalid[A-Za-z]+' coscli_output | head -40 || true
            fi
            exit 1
          fi

      - name: Verify uploaded CDN assets
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/verify-cdn-build.mjs --remote

      - name: Prepare server sources
        if: github.event_name == 'push'
        run: |
          mkdir -p dist-server
          cp deps.cirru calcit.cirru package.json yarn.lock dist-server/

      - name: Configure deploy key
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key_tc }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/diary-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/diary-ssh/key"
          chmod 600 "$RUNNER_TEMP/diary-ssh/key"

      - name: Upload PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: >-
          rsync -avzr --progress
          -e "ssh -i $RUNNER_TEMP/diary-ssh/key -o StrictHostKeyChecking=accept-new"
          dist/
          rsync-user@chenyong.life:/web-assets/repo/${{ github.repository }}/pr/

      - name: Upload production web assets
        if: github.event_name == 'push'
        run: >-
          rsync -avzr --progress
          -e "ssh -i $RUNNER_TEMP/diary-ssh/key -o StrictHostKeyChecking=accept-new"
          dist/
          rsync-user@chenyong.life:/web-assets/repo/${{ github.repository }}/

      - name: Upload server sources
        if: github.event_name == 'push'
        run: >-
          rsync -avzr --progress
          -e "ssh -i $RUNNER_TEMP/diary-ssh/key -o StrictHostKeyChecking=accept-new"
          dist-server/
          rsync-user@chenyong.life:/servers/diary/
