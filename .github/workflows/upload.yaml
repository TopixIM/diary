name: Check and deploy

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: diary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180

      - name: Install dependencies
        run: |
          caps --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Check Calcit entries
        run: |
          set -o pipefail
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry server --check-only
          calcit calcit.cirru analyze dynamic-methods --summary-only --format json | tail -n 1 | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru --entry server analyze dynamic-methods --summary-only --format json | tail -n 1 | jq -e '.data.summary.findings == 0'
          calcit test --summary-only

      - name: Build client
        run: |
          yarn compile-page
          yarn release-page

      - name: Prepare server sources
        if: github.event_name == 'push'
        run: |
          mkdir -p dist-server
          cp deps.cirru calcit.cirru package.json yarn.lock dist-server/

      - name: Configure deploy key
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key_tc }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/diary-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/diary-ssh/key"
          chmod 600 "$RUNNER_TEMP/diary-ssh/key"

      - name: Upload PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: >-
          rsync -avzr --progress
          -e "ssh -i $RUNNER_TEMP/diary-ssh/key -o StrictHostKeyChecking=accept-new"
          dist/
          rsync-user@chenyong.life:/web-assets/repo/${{ github.repository }}/pr/

      - name: Upload production web assets
        if: github.event_name == 'push'
        run: >-
          rsync -avzr --progress
          -e "ssh -i $RUNNER_TEMP/diary-ssh/key -o StrictHostKeyChecking=accept-new"
          dist/
          rsync-user@chenyong.life:/web-assets/repo/${{ github.repository }}/

      - name: Upload server sources
        if: github.event_name == 'push'
        run: >-
          rsync -avzr --progress
          -e "ssh -i $RUNNER_TEMP/diary-ssh/key -o StrictHostKeyChecking=accept-new"
          dist-server/
          rsync-user@chenyong.life:/servers/diary/
