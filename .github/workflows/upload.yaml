name: Check and deploy

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: diary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Set up Calcit and Caps
        uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Install dependencies
        run: |
          caps --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Check Calcit entries
        run: |
          set -o pipefail
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry server --check-only
          calcit calcit.cirru analyze dynamic-methods --summary-only --format json | tail -n 1 | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru --entry server analyze dynamic-methods --summary-only --format json | tail -n 1 | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru analyze deprecated --summary-only --format json
          calcit calcit.cirru --entry server analyze deprecated --summary-only --format json
          calcit test --summary-only

      - name: Build client
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/"
          fi
          base_url="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"
          export VITE_BASE_URL="${base_url}"
          yarn compile-page
          yarn release-page

      - name: Verify CDN asset references
        run: |
          node scripts/verify-cdn-build.mjs

      - name: Upload and verify static assets on COS
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: worktools/cos-upload-action@17e6d213fe9f6772a6090a13c8ba044cd6cbcb09 # v1.1.1
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Prepare server sources
        if: github.event_name == 'push'
        run: |
          mkdir -p dist-server
          cp deps.cirru calcit.cirru package.json yarn.lock dist-server/

      - name: Configure deploy key
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key_tc }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/diary-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/diary-ssh/key"
          chmod 600 "$RUNNER_TEMP/diary-ssh/key"

      - name: Upload PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: >-
          rsync -avzr --progress
          -e "ssh -i $RUNNER_TEMP/diary-ssh/key -o StrictHostKeyChecking=accept-new"
          dist/
          rsync-user@chenyong.life:/web-assets/repo/${{ github.repository }}/pr/

      - name: Upload production web assets
        if: github.event_name == 'push'
        run: >-
          rsync -avzr --progress
          -e "ssh -i $RUNNER_TEMP/diary-ssh/key -o StrictHostKeyChecking=accept-new"
          dist/
          rsync-user@chenyong.life:/web-assets/repo/${{ github.repository }}/

      - name: Upload server sources
        if: github.event_name == 'push'
        run: >-
          rsync -avzr --progress
          -e "ssh -i $RUNNER_TEMP/diary-ssh/key -o StrictHostKeyChecking=accept-new"
          dist-server/
          rsync-user@chenyong.life:/servers/diary/
